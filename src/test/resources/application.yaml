spring:
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only
    expiration: 3600000
    refresh-expiration: 604800000
